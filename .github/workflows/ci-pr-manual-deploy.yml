name: CI on PR, Manual Deploy

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static files
        run: |
          test -f BaiTap7/public/index.html
          test -f BaiTap7/public/styles.css
          test -f BaiTap7/public/js/main.js

  test:
    name: Test Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify HTML has title
        run: |
          grep -q "<title>" BaiTap7/public/index.html

  deploy:
    name: Deploy GitHub Pages (Manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: BaiTap7/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
